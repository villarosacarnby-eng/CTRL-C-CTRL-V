<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products | Hope, Inc. ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="products" data-nav="products" data-crumb="Products" data-roles="superadmin,admin">
  <main id="page" hidden>
    <div class="page-head">
      <div>
        <p class="eyebrow" data-eyebrow></p>
        <h1>Products</h1>
        <p class="sub">Maintain the product master and its effective-dated prices.</p>
      </div>
      <button type="button" class="btn btn-primary" id="crudAdd">+ Add product</button>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="inp" id="crudSearch" type="search" placeholder="Search product code or description" aria-label="Search" /></div>
      <div class="seg" id="crudTabs" role="group" aria-label="Filter by status"><button type="button" data-f="active">Active</button><button type="button" data-f="inactive">Inactive</button><button type="button" data-f="all" class="is-active">All</button></div>
    </div>
    <div class="tbl-wrap">
      <div class="tbl-scroll"><table class="tbl"><thead id="crudHead"></thead><tbody id="crudBody"></tbody></table></div>
      <div class="tbl-foot"><span id="crudCount">No records</span><span><button type="button" id="crudPrev">&lsaquo; Previous</button><button type="button" id="crudNext">Next &rsaquo;</button></span></div>
    </div>
    <div class="notice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16 9.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Current price uses the latest active effective date that is not in the future. Open <b>Current price</b> on a row to see and change its price history.</span></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="pages.js"></script>
</body>
</html>
